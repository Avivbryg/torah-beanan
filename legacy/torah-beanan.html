<style>
/* Layout: a daf. The newsletter in the main column, sentence by sentence; the commentary panel beside it (below the tapped paragraph on phones) */

}

:root[data-theme="dark"]{

body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}

.ft{padding-inline-start:10px;border-inline-start:2px solid var(--trad-soft)}
.fr{display:block;font-size:12px;font-weight:600;color:var(--trad);margin-bottom:2px;text-decoration:none}

.fx:hover{text-decoration-color:var(--trad)}

<script>
const ISSUES=[{"essay": [{"lead": "ההורג בשוגג", "segs": [["b1a", "ההורג בשוגג גולה לעיר מקלט."], ["b1b", "אין בו כוונה ואין בו רשעות, ובכל זאת הוא נעקר ממקומו, ומשך גלותו אינו תלוי בחומרת המעשה, אלא במות הכהן הגדול."], ["b1c", "ולא רק הוא: דוד, שנלחם את מלחמות ה׳, אינו בונה את המקדש, ״דם לרוב שפכת״;"], ["b1d", "וכהן שהרג נפש, אפילו בשוגג, אינו נושא את כפיו."], ["b1e", "אם אלה עונשים, הם תמוהים. ויש פרט מפתיע: ערי המקלט הן ערי הלויים."], ["b1f", "ההורג נשלח לגור אצל השבט שאין לו נחלה באדמה, כאילו נכנס לאותה מציאות: אדם שאין לו עוד קרקע משלו."], ["b1g", "אולי אין כאן עונש כלל, אלא תיאור של מציאות שנוצרה: ״כי הדם הוא יחניף את הארץ״."], ["b1h", "זהו מעין חוק שימור של הרוח: רצח אינו מכלה את רוחו של הנרצח. היא אינה נעלמת, אלא מאבדת את הגוף שהחזיק אותה ונשארת בעולם בלי מקום."], ["b1i", "ולכן אחרי הריגה, גם בשוגג, מידה כנגד מידה נוצר מצב חדש, ובו גם להורג אין מקום עם האדמה שלו."], ["b1j", "זו מערכת עיוורת, כמו יד שנכנסת לאש: היא מגיבה למה שקרה."], ["b1k", "האם המצב הזה הפיך? כדי לנסות לענות נחזור לשפיכת הדם הראשונה."]]}, {"lead": "גן עדן", "segs": [["b2a", "גן עדן הוא מצב של אחדות גבוהה יותר. האדם, שנוצר ״עפר מן האדמה״, חי בהרמוניה עם האדמה, עם החיות ועם ה׳ המתהלך בגן."], ["b2b", "אך מספיק חטא אחד כדי לשבור האחדות הזו, ככדור שעומד על פסגה חלקה ואינו יכול להישאר שם נוכח כל סטייה אינפיניטסימלית מנקודת שיווי המשקל, והוא מתגלגל לאחד הצדדים למצב אנרגטי נמוך יותר."], ["b2c", "כך המציאות האחדותית נשברת והשבר מתגלם בשני הבנים."], ["b2d", "הבל, רועה הצאן, לוקח את הקו של אדם, חי וה׳: מנחתו מבכורות צאנו, והיא נרצית."], ["b2e", "קין, עובד האדמה, לוקח את הקו של אדם, אדמה וצומח."], ["b2f", "קין הוא הכבד, בעל המקום, הקשור לקרקע; הבל, כבר בשמו, הוא אד ונשימה: רועה נודד, קל."], ["b2g", "כך גם ביקום המוקדם נולדו מכוח אחד שני חלקיקים: אחד נקשר לשדה שממלא את המרחב וקיבל מסה, והשני נשאר חסר מסה ונע תמיד."], ["b2h", "לשניהם שורש אחד, אבל האיחוד ביניהם כבר אינו יכול להתקיים בעולם המוגשם הנמוך יותר באנרגיה."], ["b2i", "המדרש מספר שקין הביא זרע פשתן והבל צמר,"], ["b2j", "ולכן נאסר השעטנז, צמר ופשתים יחדו:"], ["b2k", "חיבור של עולם הבל ועולם קין, שאין לו מקום בעולם שאחרי הגירוש, כמו שאחדות הכוחות חוזרת רק באנרגיות עצומות, ולא בעולם הקר שלנו."], ["b2l", "הנבדלות עצמה אינה חטא, אם כי רק התוצאה שלו."]]}, {"lead": "כל עוד הבל חי,", "segs": [["b3a", "כל עוד הבל חי, הוא עצמו הכלי לאורו, וקין יכול להישאר קין."], ["b3b", "המשימה היא ללמוד לחיות יחד מתוך מציאת מקום הדדי זה בעולמו של זה."], ["b3c", "אבל קין מביא ״מפרי האדמה מנחה לה׳״."], ["b3d", "אולי החטא לא היה שהמנחה הייתה גרועה, אלא שהיא הובאה לה׳ ולא לאח. קין דאג לעבודת ה׳ הפרטית שלו, ניסה ׳לסגור פינה׳ מול השמיים, ולא דאג לאחיו הנודד."], ["b3e", "הוא יכול היה להביא את פרי האדמה להבל, ולקבל ממנו את מה שאין לו. במובן זה, הבל כמחנך גם הוא לא מילא את תפקידו."], ["b3f", "ומה אמר קין להבל? ״ויאמר קין אל הבל אחיו, ויהי בהיותם בשדה״."], ["b3g", "הטקסט שותק. הקשר בין האחים לא נבנה מעולם."]]}, {"lead": "ויקם קין אל הבל אחיו ויהרגהו.", "segs": [["b4a", "ויקם קין אל הבל אחיו ויהרגהו. הבל אינו נעלם מתחת לשמיים; מהותו מתחלקת."], ["b4b", "האדמה ״פצתה את פיה לקחת את דמי אחיך מידך״, ורש״י מפרש שבכך הוסיפה לחטוא: היא קיבלה את הדם והסתירה את הרצח."], ["b4c", "האדמה קולטת את הבל הגשמי, את גופו ודמו, ונעשית ארורה עבור קין."], ["b4d", "וקין קולט את הבל הרוחני, את מהותו: בעל המקום נעשה ״נע ונד״, תכונתו של הרועה. הוא נעשה תערובת של עצמו ושל אחיו, בלי זהות יציבה."], ["b4e", "מה שלא מצא מקום מחוצה לו, נכנס לתוכו ממש. בדומה לכניסת יצר הרע לאחר חטא אדם הראשון, כעת קין צריך למצוא מקום להבל בתוכו."]]}, {"lead": "כי תעבוד את האדמה, לא תוסף תת כוחה לך; נע ונד תהיה בארץ.", "segs": [["b5a", "כי תעבוד את האדמה, לא תוסף תת כוחה לך; נע ונד תהיה בארץ."], ["b5b", "הרש״ר הירש מבחין בין שני הביטויים: ״נע״ ביחס לאדמה, אדם שאין לו מקום מנוחה בקרקע; ו״נד״ ביחס לבני האדם, אדם המנותק מן החברה."], ["b5c", "קין ביקש עולם בלי הבל, וקיבל עולם שבו גם לו עצמו אין עוד מקום ברור."], ["b5d", "מי שנודד אינו קוצר את מה שזרע, ולכן קין אינו נהנה מפרי האדמה."], ["b5e", "והאדמה עצמה ארורה יותר: היא עדיין מחזיקה את כוחה, אבל דורשת עוד ועוד כלים כדי להוציא אותו. רק אצל נח, שלפי רש״י הכין לבני האדם כלי מחרישה, יבוא לכך פתרון."], ["b5f", "והאור של הבל אינו נמוג, לא משום שמשהו מחזיק אותו, אלא משום שאין לו לאן ללכת: הרצח הסיר מהעולם את המקום היחיד שאורו התאים לו, הבל עצמו."], ["b5g", "כמעט כמו אטום מעורר שיכול לפלוט את האור רק אם יש לאור לאן לצאת; במקום שאין בו ״מקום״ לאור, האטום (קין) נשאר מעורר."]]}, {"lead": "וישב בארץ נוד.", "segs": [["b6a", "וישב בארץ נוד. הרמב״ן מפרש שאין זו מנוחה: קין נשאר באותה ארץ, אבל ״ישב נודד תמיד, לא ינוח במקום ממנה כלל״."], ["b6b", "ובכל זאת, דווקא הנע והנד בונה את הדבר הקבוע ביותר: עיר."], ["b6c", "״ויהי בונה עיר״, והכלי יקר מדייק: ״בונה״, בהווה. קין בונה כל הזמן ואינו מגיע לסוף."], ["b6d", "זו קלקלה של חוסר מנוחה. העיר פותרת את בעיית ה״נע״, את המקום, אבל לא את בעיית ה״נד״: הזהות הבלתי פתורה של קין, שנושא בתוכו את הבל."]]}, {"lead": "", "segs": [["b7a", "למרות זאת או בגלל זאת, העיר מולידה משהו חדש."], ["b7b", "הרש״ר הירש מעיר שבכפר האדם מעבד את האדמה, ובעיר האדם עצמו מעובד; ו״עיר״ מלשון עוררות."], ["b7c", "מתוך העיר מתעוררות מהויות אנושיות חדשות, ובהן ניסיון לתת לאור של הבל כלי."], ["b7d", "יבל ויובל מצליחים להביא לעולם את מהויות הרועה: יבל הוא ״אבי יושב אוהל ומקנה״, רועה כהבל אבל עם מקום; ויובל ״אבי כל תופש כינור ועוגב״, נגינת הרועה בשדה, כלי נשיפה, כלי להבל פשוטו כמשמעו."], ["b7e", "וברגע שיש לאור כלי, הוא יכול לצאת מקין, והקללה מתחילה לדעוך, כמו אטום שמוצא סוף-סוף מקום מכוונן לפלוט בו את אורו."], ["b7f", "להבדיל, כך משפחה שאיבדה בן מחפשת לבנות כלים, מפעל, ספר, בית מדרש, שימשיכו את אורו בעולם."], ["b7g", "אבל תובל קין, ״לוטש כל חורש נחושת וברזל״, כבר נושא בשמו את ״קין״: בו הבל וקין עדיין מעורבבים, והבל לא יצא לפועל באמת."], ["b7h", "וכיוון שקין לא הצליח להוציא את הבל לפועל דרך שושלתו, נגזר גם עליו להיהרג בשוגג, בידי צאצאו למך."], ["b7i", "ולפי המדרש, דווקא תובל קין הוא שכיוון את ידו של אביו העיוור."]]}, {"lead": "התיקון", "segs": [["b8a", "התיקון מגיע מכיוון אחר: ״כי שת לי אלהים זרע אחר תחת הבל״."], ["b8b", "שת, מלשון תשתית, הוא הבסיס שממנו יוצא מהלך התיקון כולו."], ["b8c", "משושלתו בא נח, שעליו נאמר ״זה ינחמנו... מן האדמה אשר אררה ה׳״."], ["b8d", "והמהלך מגיע לשלמותו בסוף ספר בראשית. אחרי דורות של אחים שנפרדו, קין והבל, יצחק וישמעאל, יעקב ועשו, בני יעקב נשארים יחד: שנים-עשר שבטים, שונים זה מזה, ובכל זאת שווים, ואיש אינו נדחה."], ["b8e", "ובמיוחד בני יוסף: יעקב שם את אפרים הצעיר לפני מנשה הבכור, ואין קנאה ואין כעס. לכן מברכים עד היום ״ישימך אלהים כאפרים וכמנשה״."], ["b8f", "בסצנת הסיום של ספר בראשית, מופיע מצב אחדותי חדש, שוני בתוך שלם אחד, כמו שלושת ה״צבעים״ של הקוורקים, השונים זה מזה אך שווים לחלוטין, ללא שבירת סימטריה."]]}, {"lead": "אבל בחטא העגל", "segs": [["b9a", "אבל בחטא העגל נשבר השוויון שוב. העבודה, שהייתה בידי הבכורות של כל השבטים, נלקחת מהם ועוברת ללוי לבדו."], ["b9b", "זו שבירת סימטריה שנייה, אבל הפעם היא נעשית לתיקון."], ["b9c", "גם לוי הרג, בשכם, וגם עליו נגזר פיזור, כמו על קין: ״ארור אפם... אחלקם ביעקב ואפיצם בישראל״."], ["b9d", "אבל ״עונש״ הפיזור נעשה לו לתפקיד של מחנך: לוי מפוזר בין השבטים, בלי נחלה, אמון על חינוך העם לתורה, ומחזר על הגרנות לתרומות ולמעשרות."], ["b9e", "ובחטא העגל, אותה קנאות מקבלת כיוון: ״מלאו ידכם היום לה׳״."], ["b9f", "לוי הורג את עובדי האלילים, ובמובן מסוים נעשה אחראי בדיוק על החלק הזה בעם ישראל: על הפולחן."], ["b9g", "לוי מקבל את עבודת המקדש, ושם, בבגדי הכהונה, גם השעטנז מותר: האיחוד של קין והבל מוצא סוף-סוף כלי."], ["b9h", "והתיקון מגיע עד למקום ההרג עצמו: שכם, העיר שבה הרג לוי, נעשית עיר לוויים ועיר מקלט."], ["b9i", "המקום שבו נשפך הדם נעשה המקום שקולט את מי ששפך דם בשוגג."], ["b9j", "מי שהרג בשוגג עוזב את האדמה, מגיע לעיר, ונדרש להתמודד עם תסביך הזהות שנוצר לו."], ["b9k", "בשונה מקין, נראה שהתורה לא מצפה שההורג בשוגג יעשה תיקון בפועל, אלא רק יחזיק מעמד עד למותו של כהן גדול."], ["b9l", "שזו אולי סגירת מעגל הכרחית כדי להראות שאירוע של שפיכת דם הוא אירוע לאומי בלתי הפיך שמשפיע על כולם ואנחנו לא נותנים לאדמה לבלוע את הדם ולהסתירו."]]}, {"lead": "וזו נחלה אמיתית.", "segs": [["b10a", "וזו נחלה אמיתית. ישראל, האדמה היא נחלתם, כקין; לוי, ה׳ הוא נחלתו, כהבל."], ["b10b", "אבל הפעם החיבור בין חומר לרוח מחזיק: יש הדדיות."], ["b10c", "עובד האדמה נותן מפרי אדמתו ללוי, והלוי נותן לו את הקשר לקדושה, והנתינה לה׳ והנתינה לאח הן מעשה אחד: ״ונתתם ממנו את תרומת ה׳ לאהרן הכהן״."], ["b10d", "בדיוק מה שקין לא עשה."], ["b10e", "אלו צריכים לאלו, ולכל אחד יש מקומו. והיעד הוא מנוחה: ״וישבו איש תחת גפנו ותחת תאנתו, ואין מחריד״."], ["b10f", "אבל מנוחה היא תכונה של השלם: אם לאחר אין מנוחה, גם לי אין."]]}], "notes": [{"id": "ber:sא", "s": ["b1a"], "who": "מקורות", "kind": "trad", "mark": "א", "t": "״וישב בה עד מות הכהן הגדול״ (במדבר ל״ה, כ״ה).", "full": [["במדבר לה, כה", "וְהִצִּילוּ הָעֵדָה אֶת־הָרֹצֵחַ מִיַּד גֹּאֵל הַדָּם וְהֵשִׁיבוּ אֹתוֹ הָעֵדָה אֶל־עִיר מִקְלָטוֹ אֲשֶׁר־נָס שָׁמָּה וְיָשַׁב בָּהּ עַד־מוֹת הַכֹּהֵן הַגָּדֹל אֲשֶׁר־מָשַׁח אֹתוֹ בְּשֶׁמֶן הַקֹּדֶשׁ.", "https://www.sefaria.org/Numbers.35.25?lang=he"]]}, {"id": "ber:sב", "s": ["b1c"], "who": "מקורות", "kind": "trad", "mark": "ב", "t": "״דם לרב שפכת... לא תבנה בית לשמי״ (דה״א כ״ב, ח׳).", "full": [["דברי הימים א כב, ח", "וַיְהִי עָלַי דְּבַר־ה׳ לֵאמֹר דָּם לָרֹב שָׁפַכְתָּ וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ לֹא־תִבְנֶה בַיִת לִשְׁמִי כִּי דָּמִים רַבִּים שָׁפַכְתָּ אַרְצָה לְפָנָי.", "https://www.sefaria.org/I_Chronicles.22.8?lang=he"]]}, {"id": "ber:sג", "s": ["b1d"], "who": "מקורות", "kind": "trad", "mark": "ג", "t": "כהן שהרג את הנפש אינו נושא כפיו (שו״ע או״ח קכ״ח, ל״ה).", "full": [["שולחן ערוך, אורח חיים קכח, לה", "כהן שהרג את הנפש אפילו בשוגג לא ישא את כפיו אפילו עשה תשובה: הגה וי\"א דאם עשה תשובה נושא כפיו ויש להקל על בעלי תשובה שלא לנעול דלת בפניהם והכי נהוג [ד\"ע דלא גרע ממומר וכ\"מ מהג\"מ] [טור רש\"י והרבה פוסקים אגור וב\"י]:", "https://www.sefaria.org/Shulchan_Arukh,_Orach_Chayim.128.35?lang=he"]]}, {"id": "ber:sד", "s": ["b1e"], "who": "מקורות", "kind": "trad", "mark": "ד", "t": "״ואת הערים אשר תתנו ללוים, את שש ערי המקלט״ (במדבר ל״ה, ו׳).", "full": [["במדבר לה, ו", "וְאֵת הֶעָרִים אֲשֶׁר תִּתְּנוּ לַלְוִיִּם אֵת שֵׁשׁ־עָרֵי הַמִּקְלָט אֲשֶׁר תִּתְּנוּ לָנֻס שָׁמָּה הָרֹצֵחַ וַעֲלֵיהֶם תִּתְּנוּ אַרְבָּעִים וּשְׁתַּיִם עִיר.", "https://www.sefaria.org/Numbers.35.6?lang=he"]]}, {"id": "ber:sה", "s": ["b1g"], "who": "מקורות", "kind": "trad", "mark": "ה", "t": "״כי הדם הוא יחניף את הארץ״ (במדבר ל״ה, ל״ג).", "full": [["במדבר לה, לג", "וְלֹא־תַחֲנִיפוּ אֶת־הָאָרֶץ אֲשֶׁר אַתֶּם בָּהּ כִּי הַדָּם הוּא יַחֲנִיף אֶת־הָאָרֶץ וְלָאָרֶץ לֹא־יְכֻפַּר לַדָּם אֲשֶׁר שֻׁפַּךְ־בָּהּ כִּי־אִם בְּדַם שֹׁפְכוֹ.", "https://www.sefaria.org/Numbers.35.33?lang=he"]]}, {"id": "ber:b1", "s": ["b1h"], "who": "באר הפוטנציאל", "kind": "beer", "mark": "1", "dh": "חוקי שימור", "body": ["אנרגיה אינה נוצרת ואינה נעלמת; היא רק עוברת מצורה לצורה. בכל התנגשות נשמרים אנרגיה, תנע ומטען, והתוצאה נקבעת לגמרי לפי המסות, המהירויות והזוויות. אין במשוואות שום איבר של ״כוונה״: כדור ביליארד אינו ״יודע״ אם השחקן כיוון או החטיא, והתנע עובר באותה מידה.", "עמוק יותר: משפט נתר מראה שכל חוק שימור נובע מסימטריה של חוקי הטבע. שימור האנרגיה, למשל, נובע מכך שהחוקים אינם משתנים עם הזמן."], "intext": "כמו שאנרגיה אינה נעלמת, כך רוחו של הנרצח אינה נעלמת; והחוק ״עיוור״: הוא מגיב למה שקרה, לא למה שרצו. לכן אם הורג בשוגג יצר מצב שאין מקום לאדם אחר, הוא מושפע גם כן."}, {"id": "ber:sו", "s": ["b2a"], "who": "מקורות", "kind": "trad", "mark": "ו", "t": "בראשית ב׳, ז׳; ב׳, י״ט; ג׳, ח׳.", "full": [["בראשית ב, ז", "וַיִּיצֶר ה׳ אֱלֹהִים אֶת־הָאָדָם עָפָר מִן־הָאֲדָמָה וַיִּפַּח בְּאַפָּיו נִשְׁמַת חַיִּים וַיְהִי הָאָדָם לְנֶפֶשׁ חַיָּה.", "https://www.sefaria.org/Genesis.2.7?lang=he"], ["בראשית ב, יט", "וַיִּצֶר ה׳ אֱלֹהִים מִן־הָאֲדָמָה כׇּל־חַיַּת הַשָּׂדֶה וְאֵת כׇּל־עוֹף הַשָּׁמַיִם וַיָּבֵא אֶל־הָאָדָם לִרְאוֹת מַה־יִּקְרָא־לוֹ וְכֹל אֲשֶׁר יִקְרָא־לוֹ הָאָדָם נֶפֶשׁ חַיָּה הוּא שְׁמוֹ.", "https://www.sefaria.org/Genesis.2.19?lang=he"], ["בראשית ג, ח", "וַיִּשְׁמְעוּ אֶת־קוֹל ה׳ אֱלֹהִים מִתְהַלֵּךְ בַּגָּן לְרוּחַ הַיּוֹם וַיִּתְחַבֵּא הָאָדָם וְאִשְׁתּוֹ מִפְּנֵי ה׳ אֱלֹהִים בְּתוֹךְ עֵץ הַגָּן.", "https://www.sefaria.org/Genesis.3.8?lang=he"]]}, {"id": "ber:b2", "s": ["b2b"], "who": "באר הפוטנציאל", "kind": "beer", "mark": "2", "dh": "שבירת סימטריה", "body": ["דמיינו כדור על ראש ״כובע מקסיקני״: כל הכיוונים שווים, והמצב סימטרי לגמרי, אבל לא יציב. הכדור חייב להתגלגל לתעלה שמסביב ולבחור נקודה אחת. החוקים נשארו סימטריים; המצב בפועל כבר לא.", "כך קרה ביקום המוקדם: כטריליונית השנייה אחרי המפץ, עם ההתקררות, ״התיישב״ שדה היגס, והכוח האלקטרו-חלש נשבר לשני כוחות: האלקטרומגנטי והחלש."], "intext": "גן עדן הוא ראש הכובע, אחדות שאינה יכולה להחזיק; חטא אחד מספיק כדי שהכדור יתגלגל."}, {"id": "ber:sז", "s": ["b2d"], "who": "מקורות", "kind": "trad", "mark": "ז", "t": "״והבל הביא גם הוא מבכרות צאנו״ (בראשית ד׳, ב׳-ד׳).", "full": [["בראשית ד, ב–ד", "וַתֹּסֶף לָלֶדֶת אֶת־אָחִיו אֶת־הָבֶל וַיְהִי־הֶבֶל רֹעֵה צֹאן וְקַיִן הָיָה עֹבֵד אֲדָמָה. וַיְהִי מִקֵּץ יָמִים וַיָּבֵא קַיִן מִפְּרִי הָאֲדָמָה מִנְחָה לַה׳. וְהֶבֶל הֵבִיא גַם־הוּא מִבְּכֹרוֹת צֹאנוֹ וּמֵחֶלְבֵהֶן וַיִּשַׁע ה׳ אֶל־הֶבֶל וְאֶל־מִנְחָתוֹ.", "https://www.sefaria.org/Genesis.4.2-4?lang=he"]]}, {"id": "ber:b3", "s": ["b2g"], "who": "באר הפוטנציאל", "kind": "beer", "mark": "3", "dh": "מסה ומקום", "body": ["בשבירה נוצרו מאותו שורש שני בוזונים, צירופים ״ניצבים״ של אותם רכיבים. ה-Z נקשר לשדה היגס שממלא את המרחב, וקיבל מסה. הפוטון לא נקשר, ונשאר חסר מסה.", "ומסה היא, במובן עמוק, היכולת לעמוד במקום: חלקיק חסר מסה חייב לנוע תמיד במהירות האור. והמסה אינה תכונה של החלקיק לבדו, אלא של הקשר שלו לשדה."], "intext": "קין, הקשור לאדמה, הוא ה-Z; הבל, הנודד, הוא הפוטון; האדמה היא השדה."}, {"id": "ber:sח", "s": ["b2i"], "who": "מקורות", "kind": "trad", "mark": "ח", "t": "קין הביא פשתן והבל צמר (תנחומא בראשית ט׳; פרקי דרבי אליעזר כ״א).", "full": [["מדרש תנחומא, בראשית ט", "ויבא קין מפרי האדמה, מהו? מן מותר מאכלו. ורבנן אמרי, זרע פשתן היה, והבל הביא גם הוא מבכורות צאנו ומחלבהן לפיכך נאסר צמר ופשתים, שנאמר: לא תלבש שעטנז וגו' (דברים כב, יא). ואמר הקדוש ברוך הוא, אינו דין שיתערב מנחת החוטא עם מנחת הזכאי לפיכך נאסר.", "https://www.sefaria.org/Midrash_Tanchuma,_Bereshit.9.1?lang=he"], ["פרקי דרבי אליעזר כא", "הביא קין מותר מאכלו קליות, זרע פשתן. והביא הבל מבכורות צאנו ומחלביהן, כבשים שלא נגזזו לצמר. ונתעב ria.org/Genesis.4.25?lang=he"]]}, {"id": "ber:sכב", "s": ["b8c"], "who": "מקורות", "kind": "trad", "mark": "כב", "t": "״זה ינחמנו ממעשנו ומעצבון ידינו מן האדמה אשר אררה ה׳״ (בראשית ה׳, כ״ט).", "full": [["בראשית ה, כט", "וַיִּקְרָא אֶת־שְׁמוֹ נֹחַ לֵאמֹר זֶה יְנַחֲמֵנוּ מִמַּעֲשֵׂנוּ וּמֵעִצְּבוֹן יָדֵינוּ מִן־הָאֲדָמָה אֲשֶׁר אֵרְרָהּ ה׳.", "https://www.sefaria.org/Genesis.5.29?lang=he"]]}, {"id": "ber:sכג", "s": ["b8e"], "who": "מקורות", "kind": "trad", "mark": "כג", "t": "״ישמך אלהים כאפרים וכמנשה״ (בראשית מ״ח, י״ד-כ׳).", "full": [["בראשית מח, כ", "וַיְבָרְכֵם בַּיּוֹם הַהוּא לֵאמוֹר בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ אֱלֹהִים כְּאֶפְרַיִם וְכִמְנַשֶּׁה וַיָּשֶׂם אֶת־אֶפְרַיִם לִפְנֵי מְנַשֶּׁה.", "https://www.sefaria.org/Genesis.48.20?lang=he"]]}, {"id": "ber:b8", "s": ["b8f"], "who": "באר הפוטנציאל", "kind": "beer", "mark": "8", "dh": "סימטריה שלא נשברת", "body": ["לא כל ריבוי נולד משבירה. לקוורקים שלושה ״צבעים״ שונים, אבל הסימטריה ביניהם אינה נשברת: אף צבע אינו מועדף, וכולם שווים לחלוטין.", "ויותר מזה: קוורק אינו מופיע לבדו לעולם, אלא רק בצירוף שלם ו״ניטרלי״ של כל הצבעים, כמו בפרוטון. שוני אמיתי, בלי היררכיה, בתוך שלם אחד."], "intext": "שבטי יעקב בסוף ספר בראשית: שונים, ובכל זאת שווים, ואין ביניהם קנאה."}, {"id": "ber:sכד", "s": ["b9a"], "who": "מקורות", "kind": "trad", "mark": "כד", "t": "״ואני הנה לקחתי את הלוים... תחת כל בכור״ (במדבר ג׳, י״ב), ורש״י שם: העבודה הייתה בבכורות, וכשחטאו בעגל נפסלו.", "full": [["במדבר ג, יב", "וַאֲנִי הִנֵּה לָקַחְתִּי אֶת־הַלְוִיִּם מִתּוֹךְ בְּנֵי יִשְׂרָאֵל תַּחַת כׇּל־בְּכוֹר פֶּטֶר רֶחֶם מִבְּנֵי יִשְׂרָאֵל וְהָיוּ לִי הַלְוִיִּם.", "https://www.sefaria.org/Numbers.3.12?lang=he"], ["רש״י, במדבר ג, יב", "ואני הנה לקחתי. וַאֲנִי מֵהֵיכָן זָכִיתִי בָהֶן מתוך בני ישראל שֶׁיִּהְיוּ יִשְׂרָאֵל שׂוֹכְרִין אוֹתָן לְשֵׁרוּת שֶׁלִּי? עַ\"יְ הַבְּכוֹרוֹת זָכִיתִי בָהֶם וּלְקַחְתִּים תְּמוּרָתָם. לְפִי שֶׁהָיְתָה הָעֲבוֹדָה בַּבְּכוֹרוֹת, וּכְשֶׁחָטְאוּ בָעֵגֶל נִפְסְלוּ, וְהַלְוִיִּם שֶׁלֹּא עָבְדוּ עֲ\"זָ נִבְחֲרוּ תַחְתֵּיהֶם (עי' זבחים קי\"ב):", "https://www.sefaria.org/Rashi_on_Numbers.3.12.1?lang=he"]]}, {"id": "ber:sכה", "s": ["b9c"], "who": "מקורות", "kind": "trad", "mark": "כה", "t": "בראשית מ״ט, ה׳-ז׳.", "full": [["בראשית מט, ה–ז", "שִׁמְעוֹן וְלֵוִי אַחִים כְּלֵי חָמָס מְכֵרֹתֵיהֶם. בְּסֹדָם אַל־תָּבֹא נַפְשִׁי בִּקְהָלָם אַל־תֵּחַד כְּבֹדִי כִּי בְאַפָּם הָרְגוּ אִישׁ וּבִרְצֹנָם עִקְּרוּ־שׁוֹר. אָרוּר אַפָּם כִּי עָז וְעֶבְרָתָם כִּי קָשָׁתָה אֲחַלְּקֵם בְּיַעֲקֹב וַאֲפִיצֵם בְּיִשְׂרָאֵל.", "https://www.sefaria.org/Genesis.49.5-7?lang=he"]]}, {"id": "ber:sכו", "s": ["b9d"], "who": "מקורות", "kind": "trad", "mark": "כו", "t": "לוי מחזר על הגרנות לתרומות ולמעשרות (רש״י בראשית מ״ט, ז׳).", "full": [["רש״י, בראשית מט, ז", "אחלקם ביעקב. אַפְרִידֵם זֶה מִזֶּה שֶׁלֹּא יְהֵא לֵוִי בְּמִנְיַן הַשְּׁבָטִים, וַהֲרֵי הֵם חֲלוּקִים. דָּבָר אַחֵר אֵין לְךָ עֲנִיִּים וְסוֹפְרִים וּמְלַמְּדֵי תִינוֹקוֹת אֶלָּא מִשִּׁמְעוֹן, כְּדֵי שֶׁיִּהְיוּ נְפוֹצִים, וְשִׁבְטוֹ שֶׁל לֵוִי עֲשָׂאוֹ מְחַזֵּר עַל הַגְּרָנוֹת לַתְּרוּמוֹת וְלַמַּעַשְׂרוֹת, נָתַן לוֹ תְּפוּצָתוֹ דֶּרֶךְ כָּבוֹד:", "https://www.sefaria.org/Rashi_on_Genesis.49.7.2?lang=he"]]}, {"id": "ber:sכז", "s": ["b9e"], "who": "מקורות", "kind": "trad", "mark": "כז", "t": "״מי לה׳ אלי״; ״מלאו ידכם היום לה׳״ (שמות ל״ב, כ״ו-כ״ט).", "full": [["שמות לב, כו–כט", "וַיַּעֲמֹד מֹשֶׁה בְּשַׁעַר הַמַּחֲנֶה וַיֹּאמֶר מִי לַה׳ אֵלָי וַיֵּאָסְפוּ אֵלָיו כׇּל־בְּנֵי לֵוִי. וַיֹּאמֶר לָהֶם כֹּה־אָמַר ה׳ אֱלֹהֵי יִשְׂרָאֵל שִׂימוּ אִישׁ־חַרְבּוֹ עַל־יְרֵכוֹ עִבְרוּ וָשׁוּבוּ מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה וְהִרְגוּ אִישׁ־אֶת־אָחִיו וְאִישׁ אֶת־רֵעֵהוּ וְאִישׁ אֶת־קְרֹבוֹ. וַיַּעֲשׂוּ בְנֵי־לֵוִי כִּדְבַר מֹשֶׁה וַיִּפֹּל מִן־הָעָם בַּיּוֹם הַהוּא כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ. וַיֹּאמֶר מֹשֶׁה מִלְאוּ יֶדְכֶם הַיּוֹם לַה׳ כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו וְלָתֵת עֲלֵיכֶם הַיּוֹם בְּרָכָה.", "https://www.sefaria.org/Exodus.32.26-29?lang=he"]]}, {"id": "ber:sכח", "s": ["b9g"], "who": "מקורות", "kind": "trad", "mark": "כח", "t": "שעטנז בבגדי כהונה (יומא ס״ט ע״א).", "full": [["יומא סט ע״א", "פושטין ומקפלין ומניחין אותן תחת ראשיהן, שמעת מינה בגדי כהונה ניתנו ליהנות בהן! אמר רב פפא: לא תימא תחת ראשיהן, אלא אימא כנגד ראשיהן. אמר רב משרשיא: שמעת מינה תפילין מן הצד שפיר דמי. הכי נמי מסתברא דכנגד ראשיהן, דאי סלקא דעתך תחת ראשיהן, ותיפוק לי משום כלאים — דהא איכא אבנט. ונהי נמי דניתנו ליהנות בהן — הא מתהני מכלאים!", "https://www.sefaria.org/Yoma.69a.2-3?lang=he"]]}, {"id": "ber:sכט", "s": ["b9h"], "who": "מקורות", "kind": "trad", "mark": "כט", "t": "שכם עיר מקלט ועיר לוויים (יהושע כ׳, ז׳; כ״א, כ״א).", "full": [["יהושע כ, ז", "וַיַּקְדִּשׁוּ אֶת־קֶדֶשׁ בַּגָּלִיל בְּהַר נַפְתָּלִי וְאֶת־שְׁכֶם בְּהַר אֶפְרָיִם וְאֶת־קִרְיַת אַרְבַּע הִיא חֶבְרוֹן בְּהַר יְהוּדָה.", "https://www.sefaria.org/Joshua.20.7?lang=he"], ["יהושע כא, כא", "וַיִּתְּנוּ לָהֶם אֶת־עִיר מִקְלַט הָרֹצֵחַ אֶת־שְׁכֶם וְאֶת־מִגְרָשֶׁהָ בְּהַר אֶפְרָיִם וְאֶת־גֶּזֶר וְאֶת־מִגְרָשֶׁהָ.", "https://www.sefaria.org/Joshua.21.21?lang=he"]]}, {"id": "ber:sל", "s": ["b10c"], "who": "מקורות", "kind": "trad", "mark": "ל", "t": "במדבר י״ח, כ״ח.", "full": [["במדבר יח, כח", "כֵּן תָּרִימוּ גַם־אַתֶּם תְּרוּמַת ה׳ מִכֹּל מַעְשְׂרֹתֵיכֶם אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל וּנְתַתֶּם מִמֶּנּוּ אֶת־תְּרוּמַת ה׳ לְאַהֲרֹן הַכֹּהֵן.", "https://www.sefaria.org/Numbers.18.28?lang=he"]]}, {"id": "ber:sלא", "s": ["b10e"], "who": "מקורות", "kind": "trad", "mark": "לא", "t": "מיכה ד׳, ג׳-ד׳.", "full": [["מיכה ד, ג–ד", "וְשָׁפַט בֵּין עַמִּים רַבִּים וְהוֹכִיחַ לְגוֹיִם עֲצֻמִים עַד־רָחוֹק וְכִתְּתוּ חַרְבֹתֵיהֶם לְאִתִּים וַחֲנִיתֹתֵיהֶם לְמַזְמֵרוֹת לֹא־יִשְׂאוּ גּוֹי אֶל־גּוֹי חֶרֶב וְלֹא־יִלְמְדוּן עוֹד מִלְחָמָה. וְיָשְׁבוּ אִישׁ תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ וְאֵין מַחֲרִיד כִּי־פִי ה׳ צְבָאוֹת דִּבֵּר.", "https://www.sefaria.org/Micah.4.3-4?lang=he"]]}], "id": "bereshit", "parsha": "בראשית", "title": "נע ונד", "ref": "שבת פרשת בראשית · כ״ט בתשרי תשפ״ז", "foot": ""}, {"essay": [{"lead": "וכל אשר יקרא לו האדם נפש חיה הוא שמו.", "segs": [["1a", "וכל אשר יקרא לו האדם נפש חיה הוא שמו."], ["1b", "לא רק שבמתן השמות אין איסור, חז״ל רואים בזה מעלה של האדם על המלאכים: הם לא ידעו לקרוא לבעלי החיים בשם, ואילו אדם קורא ״זה שור, זה חמור, זה סוס וזה גמל״."], ["1c", "עשרה דורות אחר כך, בבקעה בארץ שנער, אומרים בני האדם: ״הבה נבנה לנו עיר ומגדל וראשו בשמים, ונעשה לנו שם״, והפעם קריאת השם נגמרת בבלבול השפות ובפיזור."], ["1d", "מדוע מתן שם אחד זוכה לתשבוחות, והשני לעונש בידי שמים? לשם כך נשאל ראשית: מה הפעולה שעושה שם?"]]}, {"lead": "שם תוחם.", "segs": [["2a", "שם תוחם. כל עוד לדבר אין שם הוא אמורפי; ברגע שקראנו לו בשם, נתנו לו גבול ונפרדות."], ["2b", "פרקטיקה זו מוכרת בטיפול: מי שאומר על תחושה ״זה כעס״ יוצר הפרדה בינו לבין הרגש, והרגש נעשה חלק עצמאי אך סופי, שאפשר למצוא לו מקום בתוכו."], ["2c", "כך תחושה טוטאלית וסוחפת פתאום קיבלה צורה, שכמעט אפשר לאחוז ביד. את חווית ההקלה הסובייקטיבית אף ניתן לצפות בשינוי מוקדי פעילות המוח."], ["2d", "הצורך בנפרדות פנימית (מתחושות, רגשות) ונפרדות חיצונית (מיתר הבריות) מסתדר מצוין עם הסיפור שהאדם בגן עדן מגדיר את השמות של החיות."], ["2e", "הבהמה, לפי המהר״ל, נקראת על שם ״ב״ה מ״ה״: כל מה שנבראה לשמו כבר נמצא בה, אז ממילא ניתן לתת לה שם ולגדור את המהות שלה."], ["2f", "אבל אם כך, איך יתכן שהאדם קורא לחוה בשם? האם להגדיר את מהותו של אדם?"]]}, {"lead": "ואתה מה שמך?", "segs": [["3a", "ואתה מה שמך? שואל הקב״ה את אדם, והוא עונה: ״אני נאה להיקרא אדם, שנבראתי מן האדמה״."], ["3b", "היפה תואר (פירושו של ר׳ שמואל יפה אשכנזי על המדרש, קושטא, המאה ה-16) מסביר: שמות בעלי החיים ניתנו לפי עצמותם, ועצמות האדם היא נפשו; ובכל זאת קרא לעצמו אדם, ״בשביל שחלקי האדמה מוחשים בו והנפש סתורה בקרבו״, כלומר האדם נקרא על הצד הגלוי שלו."], ["3c", "ומאותה סיבה קרא לקב״ה ״א-דני״, שאנו מכירים אותו רק מפעולותיו, ״אבל עצמותו לא תקרא בשם״."], ["3d", "והמהר״ל נותן זווית קצת שונה, כמעט הפוכה: הרי כל הנמצאים מן האדמה, ומדוע דווקא האדם נקרא על שמה? כי ״האדמה היא מיוחדת בזה שהיא בכח״: היא אינה רק מה שהיא עכשיו, אלא מה שעוד יצמח ממנה, ״וזהו ענין האדם שהוא בכח, ויוצא שלימותו אל הפעל״."], ["3e", "ויש שדרשו את השם גם כלפי מעלה: ״אדם״ מלשון ״אֶדַּמֶּה לעליון״."], ["3f", "שם אחד שפונה לשני כיוונים: אדם נוצר מן האדמה, אבל מגמתו להידמות לעליון."]]}, {"lead": "איך נותנים שם למי שעוד לא יצא אל הפועל כל צורכו?", "segs": [["4a", "איך נותנים שם למי שעוד לא יצא אל הפועל כל צורכו? יצור שהוא ברובו בכח, שהפוטנציאל שלו אינסופי, אינו נתפס כולו בשם אחד."], ["4b", "הוא מתגלה רק חלקית, דרך תפקידים ויחסים: בן זוג, הורה, רועה, עובד אדמה."], ["4c", "כל שם כזה הוא שם של קשר, ולכן הוא ניתן מבחוץ, כמו שאדם יכול לקרוא לחוה רק אחרי שנבנתה ממנו ״עזר כנגדו״."], ["4d", "ומכאן הקושי לתת שם לעצמי. גם כשאדם במדרש ״נתן״ לעצמו שם, נראה מהפשט, וגם לפי הפירוש, שהוא לא הגדיר את עצמו בכללותו, אלא דימה את עצמו מצידו החומרי והסופי, לאדמה."], ["4e", "אז במילים אחרות, השם שלו מתאר רק את צידו הסופי, והצד האינסופי שבו נותר בלי שם ממש."], ["4f", "אבל כאן מתעוררת שאלה. את האמת שאי אפשר להגדיר את הקב״ה בשם, כי הוא אינסופי, עוד קל לנו בימינו לקבל: אין לו גוף ואין לו גבול ולכן גם אין שם שמגדיר את עצמותו, אלא רק הופעות."], ["4g", "אבל איך יכול האדם להיות גם סופי וגם אינסופי?"], ["4h", "למתמטיקה יש לזה תמונה מדויקת: הקטע מ-0 עד 1 קצר וחסום (סופי), ובכל זאת יש בו בדיוק אותה כמות נקודות כמו בישר אינסופי כולו."], ["4i", "כך האדם: ״כל מה שברא הקב״ה בעולמו ברא באדם״, עולם קטן, אותו תוכן בתוך גבול."], ["4j", "יש לו גבול, ולכן אפשר לקרוא לו בשם; ומה שבתוכו אינסופי, ולכן כל אוסף סופי של שמות אנושיים לעולם לא ממצה אותו."], ["4k", "והשם הזה ניתן מלמעלה לאנושות כולה: ״ויקרא את שמם אדם״, שם פתוח, שמצביע על הכח ואינו תוחם אותו."]]}, {"lead": "מה רצו להשיג אנשי בבל בנעשה לנו שם?", "segs": [["5a", "מה רצו להשיג אנשי בבל בנעשה לנו שם? הרי היה להם שם, אדם, כאמור שם פתוח של יצור שהוא בכח."], ["5b", "נראה שיש קשר למציאות ששררה באותה תקופה: ״ויהי כל הארץ שפה אחת ודברים אחדים״."], ["5c", "הנצי״ב מדייק שהתורה אינה מפרטת מה היו אותם ״דברים״, כי החטא לא היה בתוכנם אלא בעצם האחידות; ו״נעשה לנו שם״, לדבריו, הוא מינוי ממונים ״להעניש את העובר״, את מי שיחשוב אחרת."], ["5d", "כאן ההתנגשות חזיתית למודל שהזכרנו מעלה. אם האדם הוא מהות מתפתחת, שמתגלה בעוד ועוד תפקידים, דעות ושפות, הרי שכל חריגה מן הפרדיגמה (שהיא בטבעה אנושית וסופית) היא בדיוק הדרך שבה הכח יוצא אל הפועל."], ["5e", "חברה שמענישה כל מי שחורג ממנה אינה רק מגבילה את חירותו; היא מכריזה שהאדם כבר נגמר, שהוא בהמה, ״בה מה״, שכל מה שבו כבר נמצא."], ["5f", "וזה, לענ״ד, ״נעשה לנו שם״: מהות קולקטיבית מצומצמת וסגורה שהם נותנים לעצמם במקום השם הפתוח שקיבלו."]]}, {"lead": "מה הניע את אנשי בבל לסגירות הזו?", "segs": [["6a", "מה הניע את אנשי בבל לסגירות הזו? אחרי המבול ה׳ מברך את נח ובניו: ״פרו ורבו ומלאו את הארץ״."], ["6b", "אבל מי ששמע שעולם שלם נמחק במים אינו ממהר להתפזר בו."], ["6c", "לפי רש״י, אנשי בבל חששו שהרקיע יתמוטט שוב כבימי המבול, ולכן ביקשו לעשות לו ״סמוכות״, עמוד שיחזיק את השמים שלא יפלו; וחששו ממכה שתפיץ אותם: ״פן נפוץ על פני כל הארץ״."], ["6d", "מי שרוצה להחזיק את השמים צריך את כולם מגובשים יחד."], ["6e", "הם מחפשים מקום אחד שיכיל את כולם, ודווקא בבקעה, שאין בה אבנים, הם מייצרים חומר בניין מלאכותי: ״ותהי להם הלבנה לאבן״."], ["6f", "זו התגובה המתבקשת גם היום להסתגלות מול משבר אקלים: להתכנס תחת קונצנזוס ולרתום את מיטב המוחות לפיתוח טכנולוגיה שתשלוט באי-הוודאות האקלימית."], ["6g", "ויש כאן מתח עמוק: קריאה לפעולה דורשת חזית אחידה, ״שפה אחת״, ואילו המדע חי מביקורת מתמדת על כל תיאוריה באשר היא."], ["6h", "כשהקונצנזוס נעשה סיבה להשתיק קולות ביקורתיים, אנחנו קרובים ל״להעניש את העובר״."], ["6i", "ובקיצור, סגירות נולדת מפחד."]]}, {"lead": "במה בעצם הם ביקשו לתמוך?", "segs": [["7a", "במה בעצם הם ביקשו לתמוך? קשה לנו היום להבין את אנשי בבל לפי הפשט של רש״י."], ["7b", "אפשר להציע שבימינו, המאמץ שלנו למנוע מהשמיים ליפול שנית שקול לבקשה שלנו לצמצם את ה׳שארית׳ של המודלים שלנו: לא להשאיר שום מרחב מחוץ לשליטה ולבקרה האנושית-המדעית."], ["7c", "רש״ר הירש מסביר את המילה ״שמים״ כ״שם״ כפול: עבור כל נקודה ביקום, כל שאר המרחב הוא ״שמים״."], ["7d", "שָׁם הוא מקום שאפשר להצביע עליו; שָׁמַיִם הם שָׁם ועוד שָׁם, בלי סוף."], ["7e", "במונחים מתמטיים, השמים אינם קומפקטיים: שום מספר סופי של ״שָׁם״ לא יכסה אותם."], ["7f", "לתמוך בשמים פירושו להגיע לאינסוף במספר סופי של לבנים סופיות. ולכן לא משנה כמה גבוה המגדל: אין בשמים נקודה אחת שאפשר להניח עליה את ראשו, וממילא הוא לעולם לא יחזיק אותם."], ["7g", "ובהקשר המודרני, השמים במובן הרחב לעולם אינם מאפשרים לאדם להבין את המציאות עד תומה: תמיד יש עוד שָׁם שההבנה שלנו אינה מכסה."], ["7h", "ויש כאן גם עיוות של שם האדם עצמו. ״אדמה לעליון״ נאמר במקרא דווקא בפי מלך בבל: ״השמים אעלה... אעלה על במתי עב, אדמה לעליון״."], ["7i", "הדמיון לאלוהים, שהיה טמון בשם הפתוח, נהפך לטיפוס פיזי אל השמים."]]}, {"lead": "ואם לא לשמים, האם היה להם סיכוי להגיע לפחות לעננים?", "segs": [["8a", "ואם לא לשמים, האם היה להם סיכוי להגיע לפחות לעננים? היום אנחנו יודעים שא-לוהים אינו יושב מעל העננים, ושהרקיע אינו תקרה שצריך לתמוך בה."], ["8b", "אבל את השאלה ההנדסית אפשר לשאול כפשוטה: כמה גבוה יכול מגדל לבנים להגיע?"], ["8c", "כל לבנה נושאת את משקל כל מה שמעליה, ועל מנת למנוע קריסה תחת מאמץ לחיצה של לבנים בבסיס, מגדל לבנים שרופות שבסיסו מכסה את כל בקעת שנער מגיע לכל היותר לכ-18 ק״מ."], ["8d", "אז נראה שתיאורטית כן אפשר להגיע מעל העננים, אבל ככל שממשיכים לטפס בגובה, הבסיס נדרש להתרחב פי מיליון כדי לתמוך בגידול של פי 28 לגובה."], ["8e", "הזיגורת שמצאו בבל, אגב, הגיעה לכל היותר לכ-90 מ׳."], ["8f", "אז למיזם לא הייתה באמת יכולת מעשית וגם לא תיאורטית להגיע השמימה, ובכל זאת ה׳ יורד לראות, ואומר: ״ועתה לא יבצר מהם כל אשר יזמו לעשות״."], ["8g", "אם המגדל ממילא נועד להיכשל, למה להתערב? המפרשים מסיטים את המבט מן המגדל אל מה שיבוא אחריו."], ["8h", "הר״ן כותב שבבנייה עצמה לא היה חטא, אבל ״השי״ת צופה למרחוק, ירד למה שימשך מקיבוץ האנשים רעה״."], ["8i", "והנצי״ב מפרט: כשיגמרו את המגדל, עלולים להפוך את האחדות לכפייה בכוח של כל דעה אחרת, עד ״רצח ושוד המשחית את הישוב לגמרי״."], ["8j", "מגדל שנולד מפחד לא מרגיע את הפחד. הוא נעצר בגבול שלו, השמים נשארים רחוקים, וחברה שכל כולה מגויסת לפרויקט אחד, תחפש לכפות את עצמה על הפרט במישור אחר."], ["8k", "הפיזור, אם כך, אינו נקמה על ניסיון מרד שהצליח או שנכשל, אלא הצלה ממה שמיזם היה מוליד."]]}, {"lead": "על כן קרא שמה בבל", "segs": [["9a", "על כן קרא שמה בבל, כי שָׁם בלל ה׳ שפת כל הארץ, ומִשָּׁם הפיצם."], ["9b", "בפסוק החותם נפגשות שתי המילים. הם רצו לעשות לעצמם שֵׁם, וקיבלו שם חת מהן. כל גבול בין שני שמות משאיר רצועה כזאת, ולכן אוסף סופי של שמות אנושיים משאיר חורים."], "intext": "האדם, כמו [0,1], חסום, ולכן אפשר לקרוא לו בשם; אבל השמות שלנו עבים מכדי למצות אותו. ולשמים אין גבול כלל: תמיד חסר בהם עוד שָׁם."}, {"id": "sיא", "s": ["4k"], "who": "מקורות", "kind": "trad", "mark": "יא", "t": "״ויקרא את שמם אדם״ (בראשית ה׳, ב׳).", "full": [["בראשית ה, ב", "זָכָר וּנְקֵבָה בְּרָאָם וַיְבָרֶךְ אֹתָם וַיִּקְרָא אֶת־שְׁמָם אָדָם בְּיוֹם הִבָּרְאָם.", "https://www.sefaria.org/Genesis.5.2?lang=he"]]}, {"id": "sיב", "s": ["5b"], "who": "מקורות", "kind": "trad", "mark": "יב", "t": "בראשית י״א, א׳.", "full": [["בראשית יא, א", "וַיְהִי כׇל־הָאָרֶץ שָׂפָה אֶחָת וּדְבָרִים אֲחָדִים.", "https://www.sefaria.org/Genesis.11.1?lang=he"]]}, {"id": "sיג", "s": ["5c"], "who": "מקורות", "kind": "trad", "mark": "יג", "t": "העמק דבר בראשית י״א, א׳-ד׳.", "full": [["העמק דבר, בראשית יא, א", "ודברים אחדים. לא ביאר הכתוב הדברים אלא ברמז כמבואר במדרשים אבל לא פירשן הכתוב כי אם שהיו דברים אחדים וללמדנו דלא משום הדברים התעורר הקב״ה. כי אם בשביל שהיו אחדים. יהיו מה שיהיו. ודבר זה אם כי לפי הנראה אין בזה שום עון ואדרבה חבור עצבים ג״כ ראוי להניח. אבל כאן גרם לחשוב דבר שיצא לתקלת הישוב כאשר יבואר:", "https://www.sefaria.org/Haamek_Davar_on_Genesis.11.1.2?lang=he"], ["העמק דבר, בראשית יא, ד", "ונעשה לנו שם. אנשים משגיחים וממונים על הדבר ויהיו שרי צבא להעניש את העובר. דבל״ז אינו מועיל המגדל. כ״ז היה לחשש. פן נפוץ על פני כל הארץ. אמנם יש להבין מה חששו אם יצאו כמה לארץ אחרת. ומובן שזה היה שייך לדברים אחדים שהיה ביניהם ובאשר אין דעות ב״א שוים חששו שלא יצאו ב״א מדעה זו ויהיו במחשבה אחרת ע״כ היו משגיחים שלא יצא איש מישוב שלהם. ומי שסר מדברים אחדים שביניהם היה משפטו לשריפה כאשר עשו לא״א. נמצא היו דברים אחדים שביניהם לרועץ שהחליטו להרוג את מי שלא יחשוב כדעתם. ויבואר עוד להלן ו׳:", "https://www.sefaria.org/Haamek_Davar_on_Genesis.11.4.2?lang=he"]]}, {"id": "sיד", "s": ["6a"], "who": "מקורות", "kind": "trad", "mark": "יד", "t": "בראשית ט׳, א׳; ט׳, ז׳.", "full": [["בראשית ט, א", "וַיְבָרֶךְ const likes=c=>{let n=0;for(const k in likeDocs) if(likeDocs[k]&&likeDocs[k][c.id]) n++;return n;};
const iLiked=id=>!!(me.id&&likeDocs[me.id]&&likeDocs[me.id][id]);
const whoName=w=>STATIC.includes(w)?w:(pens[w]||names[w]||"משתתף/ת");
const myPen=()=>me.id?(pens[me.id]||""):"";
const firstSeg=(c,pi)=>c.s.filter(x=>pi==null||(SEGISSUE[x]===state.issue&&SEGPARA[x]===pi)).sort((a,b)=>ISSUE_ORDER[SEGISSUE[a]]-ISSUE_ORDER[SEGISSUE[b]]||SEGNUM[a]-SEGNUM[b])[0];

/* ---------- rendering ---------- */
function likeBtn(c){
  const dis=writable?"":" disabled";
  return `<button class="like" data-id="${esc(c.id)}" aria-pressed="${iLiked(c.id)}" aria-label="לייק"${dis}>👍 ${likes(c)}</button>`;
}
function head(c){
  if(c.kind==="beer") return `<span class="mark">${c.mark||"✦"}</span><span class="ttl">${esc(c.dh)}</span>`;
  if(c.kind==="trad") return `<span class="mark">${c.mark}</span><span class="ref">${esc(c.t)}</span>`;
  return `<span class="mark">💬</span><span class="ttl">${esc(whoName(c.who))}</span><span class="dhs">${c.att||c.link?(c.att&&c.att.type.startsWith("image/")?"🖼 ":c.att?"📄 ":"🔗 "):""}${esc(c.dh||(c.t?c.t.slice(0,48)+(c.t.length>48?"…":""):(c.att?c.att.name:"קישור")))}</span><span class="lc">👍 ${likes(c)}</span>`;
}
function body(c){
  if(c.kind==="beer") return `<div class="body">${c.body.map(p=>`<p>${p}</p>`).join("")}${c.intext?`<div class="intext"><b>ובטקסט:</b> ${esc(c.intext)}</div>`:""}</div><div class="foot"><span></span>${likeBtn(c)}</div>`;
  if(c.kind==="trad") return c.full&&c.full.length? c.full.map(([r,t,u])=>`<div class="ft"><a class="fr" href="${u}" target="_blank" rel="noopener">${esc(r)} <span class="ext">בספריא ↗</span></a><a class="fx" href="${u}" target="_blank" rel="noopener">${esc(t)}</a></div>`).join("") : `<p class="empty">הטקסט המלא של מקור זה עדיין לא זמין כאן.</p>`;
  const when=c.at?new Date(c.at).toLocaleDateString("he-IL",{day:"numeric",month:"short"}):"";
  const canDel=writable&&(c.uid===me.id||me.isOwner);
  let extra="";
  if(c.att){ const src="/_blob/"+c.att.id;
    extra+= c.att.type.startsWith("image/")
      ? `<a class="attimg" href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="${esc(c.att.name)}" loading="lazy"></a>`
      : `<a class="attfile" href="${src}" target="_blank" rel="noopener">📄 ${esc(c.att.name)}</a>`; }
  if(c.link){ let host=""; try{host=new URL(c.link).hostname.replace(/^www\./,"");}catch(e){} extra+=`<a class="attlink" href="${esc(c.link)}" target="_blank" rel="noopener">🔗 ${esc(host||c.link)}</a>`; }
  return `${c.dh?`<div class="dh">${esc(c.dh)}</div>`:""}${c.t?`<div class="body ctext">${esc(c.t)}</div>`:""}${extra}<div class="foot"><span class="mini">${esc(whoName(c.who))}${when?" · "+when:""}${canDel?` · <button class="del" data-id="${esc(c.id)}">מחיקה</button>`:""}</span>${likeBtn(c)}</div>`;
}
function item(c,pi){
  const sid=firstSeg(c,pi);
  const is=ISSUE_BY_ID[SEGISSUE[sid]]; const tag=(pi==null&&ISSUES.length>1)?`<span class="itag">${esc(is.parsha)}</span> `:"";
  const plead=is.essay[SEGPARA[sid]].lead||is.essay[SEGPARA[sid]].segs[0][1].slice(0,60)+"…";
  const ctx=c.whole?`<button class="ctx" data-s="${sid}">${tag}<span class="mini">על כל הפסקה</span> ${esc(plead)}</button>`:`<button class="ctx" data-s="${sid}">${tag}<span class="mini">על המשפט</span> ${esc(SEGS[sid])}</button>`;
  const open=openIds.has(c.id)?" open":"";
  return `<details class="it ${c.kind}" data-id="${esc(c.id)}"${open}><summary>${head(c)}<span class="chev" aria-hidden="true"></span></summary><div class="in">${ctx}${body(c)}</div></details>`;
}
function addForm(pi){
  if(!writable) return `<div class="add ro"><p class="mini">${readOnlyText()}</p></div>`;
  const d=state.draft;
  const opts=ESSAY[pi].segs.map(([id,t])=>`<option value="${id}"${d.seg===id?" selected":""}>משפט ${SEGNUM[id]}: ${esc(t.slice(0,60))}${t.length>60?"…":""}</option>`).join("");
  return `<form class="add" id="add-form" autocomplete="off" novalidate>
    <div class="group">הוספת פירוש</div>
    ${myPen()?"":`<label class="fl" for="add-pen">שם המפרש שלך (יוצג ליד כל הפירושים שלך)</label><input id="add-pen" maxlength="30" value="${esc(d.pen||"")}" placeholder="למשל: בעל הלבנים">`}
    <label class="fl" for="add-seg">על מה הפירוש?</label>
    <select id="add-seg"><option value="">על כל הפסקה</option>${opts}</select>
    <label class="fl" for="add-dh">כותרת קצרה (לא חובה)</label>
    <input id="add-dh" maxlength="80" value="${esc(d.dh)}" placeholder="למשל: אחדות מול אחידות">
    <label class="fl" for="add-text">הפירוש שלך</label>
    <textarea id="add-text" rows="4" maxlength="4000" placeholder="מה הפסקה מעוררת אצלך? הערה, קושיה, מקור נוסף או תיקון.">${esc(d.text)}</textarea>
    <label class="fl" for="add-link">מקור נוסף: קישור (לא חובה)</label>
    <input id="add-link" type="url" inputmode="url" dir="ltr" value="${esc(d.link||"")}" placeholder="https://www.sefaria.org/…">
    ${assets?`<label class="fl" for="add-file">מקור נוסף: תמונה או PDF (לא חובה, עד 20MB)</label>
    <input id="add-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf">`:""}
    <div class="addrow"><span class="mini" id="add-msg" aria-live="polite"></span><button type="submit" class="pub" id="add-btn">פרסום</button></div>
  </form>`;
}
function readOnlyText(){
  if(readOnlyReason==="loading") return "מתחבר…";
  if(readOnlyReason==="nodb") return "מצב קריאה בלבד. כדי לכתוב פירושים ולסמן 👍 צריך להיכנס עם חשבון Claude שהוזמן לדף הזה.";
  if(readOnlyReason==="noid") return "מצב קריאה בלבד. כדי לכתוב פירושים צריך להיות מחובר/ת לחשבון Claude.";
  return "מצב קריאה בלבד. ההרשאה שלך בדף הזה מאפשרת לקרוא בלבד; בקשו מאביב הזמנה ככותב/ת.";
}
function renderEssay(){
  const all=ALL();
  $("essay").innerHTML=ESSAY.map((p,pi)=>{
    const inp=all.filter(c=>inPara(c,pi));
    const nb=inp.filter(c=>c.kind==="beer").length, nt=inp.filter(c=>c.kind==="trad").length, nc=inp.filter(c=>c.kind==="comm").length;
    const txt=p.segs.map(([id,t],i)=>{
      let h=esc(t); if(i===0&&t.startsWith(p.lead)) h=`<strong>${esc(p.lead)}</strong>`+esc(t.slice(p.lead.length));
      const marks=C.filter(c=>c.s.includes(id)&&c.mark);
      return h+(marks.length?`<sup class="m">${marks.map(c=>`<span class="mk ${c.kind}">${c.mark}</span>`).join(" ")}</sup>`:"");
    }).join(" ");
    const cur=state.mode==="para"&&state.para===pi;
    return `<section data-p="${pi}"><div class="para" role="button" tabindex="0" data-p="${pi}" aria-expanded="${cur}" aria-current="${cur}">${txt}<span class="pcount">${nb?`<span class="pc beer"><i></i>${nb} באר הפוטנציאל</span>`:""}${nt?`<span class="pc trad"><i></i>${nt} מקורות</span>`:""}<span class="pc comm"><i></i>${nc?nc+" מהקהילה":"הוסיפו פירוש"}</span></span></div></section>`;
  }).join("");
}
function renderPanel(){
  const p=$("panel"); const all=ALL();
  p.hidden=state.mode==="para"&&state.para==null;
  if(state.mode==="para"){
    if(state.para==null){$("essay").after(p);return;}
    const pi=state.para;
    const list=all.filter(c=>inPara(c,pi));
    const pos=c=>SEGNUM[firstSeg(c,pi)];
    const groups=[["beer","באר הפוטנציאל",(a,b)=>pos(a)-pos(b)],["trad","מקורות",(a,b)=>pos(a)-pos(b)],["comm","מפרשי הקהילה",(a,b)=>likes(b)-likes(a)||(a.at<b.at?-1:1)]];
    p.innerHTML=`<div class="phead"><h2>${esc((ESSAY[pi].lead||ESSAY[pi].segs[0][1].slice(0,40)+"…").replace(/[.?:,]$/,""))}</h2><button class="close" aria-label="סגירה">✕</button></div><p class="mini hintline">לחצו על פירוש או מקור כדי לפתוח אותו במלואו.</p>`+
      groups.map(([k,label,sort])=>{const g=list.filter(c=>c.kind===k).sort(sort);
        if(k==="comm") return `<section class="grp g-comm"><div class="group">${label}${g.length?` <span class="gc">${g.length}</span>`:""}</div>${g.length?g.map(c=>item(c,pi)).join(""):`<p class="empty">עדיין אין פירושים מהקהילה על הפסקה הזו. אפשר להיות הראשונים.</p>`}${addForm(pi)}</section>`;
        return g.length?`<section class="grp g-${k}"><div class="group">${label} <span class="gc">${g.length}</span></div>`+g.map(c=>item(c,pi)).join("")+`</section>`:""}).join("");
    document.querySelector(`section[data-p="${pi}"]`).appendChild(p); p.classList.add("inline");
  }else{
    const key=c=>{const s=firstSeg(c); return ISSUE_ORDER[SEGISSUE[s]]*10000+SEGNUM[s];};
    const list=all.filter(c=>c.who===state.person).sort((a,b)=>key(a)-key(b));
    const total=list.reduce((s,c)=>s+likes(c),0);
    p.innerHTML=`<div class="phead"><h2>${esc(whoName(state.person))}</h2></div><p class="mini hintline">${list.length} פירושים${state.person==="מקורות"?"":` · ${total} 👍`} · לחצו על פירוש כדי לפתוח אותו.</p>`+(list.length?list.map(c=>item(c,null)).join(""):`<p class="empty">אין כאן פירושים כרגע.</p>`);
    $("essay").after(p); p.classList.remove("inline");
  }
}
function score(w,all){return all.filter(c=>c.who===w).reduce((s,c)=>s+likes(c),0)}
function renderChips(){
  const all=ALL();
  const people=[...new Set(all.map(c=>c.who))].sort((a,b)=>(a==="מקורות")-(b==="מקורות")||score(b,all)-score(a,all));
  if(!people.includes(state.person)) state.person=people[0];
  $("chips").innerHTML=people.map(w=>`<button class="chip" data-p="${esc(w)}" aria-pressed="${w===state.person}">${esc(whoName(w))}${w==="מקורות"?"":` · ${score(w,all)} 👍`}</button>`).join("");
}
function renderStatus(){
  const st=$("status");
  if(writable){ st.hidden=false; st.className="status ok";
    if(editingPen){ st.innerHTML=`<form id="pen-form" class="penf" novalidate><label for="pen-in">שם המפרש שלך</label><input id="pen-in" maxlength="30" value="${esc(myPen())}" placeholder="למשל: בעל הלבנים"><button type="submit" class="pub sm">שמירה</button><button type="button" class="lnk" id="pen-cancel">ביטול</button><span class="mini" id="pen-msg" aria-live="polite"></span><span class="mini penhint">השינוי יחול גם על כל הפירושים שכבר כתבת.</span></form>`; }
    else { const p=myPen(); st.innerHTML= p?`כותב/ת בשם <b>${esc(p)}</b> · <button class="lnk" id="pen-edit">שינוי שם</button>`:`מחובר/ת. לפני הפירוש הראשון כדאי לבחור שם מפרש · <button class="lnk" id="pen-edit">בחירת שם</button>`; }
  }
  else if(readOnlyReason==="loading"){ st.hidden=true; }
  else { st.hidden=false; st.className="status ro"; st.textContent=readOnlyText(); }
}
function render(){
  $("chips").hidden=state.mode!=="person";
  $("hint").textContent=state.mode==="para"
    ?"זה העלון עצמו. לחצו על פסקה כדי לראות את כל המפרשים והמקורות שלה ולהוסיף פירוש משלכם."
    :"בחרו מפרש כדי לקרוא את כל מה שכתב, ברצף. המפרשים ממוינים לפי סך ה-👍.";
  $("m-seg").setAttribute("aria-pressed",state.mode==="para");
  $("m-person").setAttribute("aria-pressed",state.mode==="person");
  $("essay").after($("panel"));
  $("essay").hidden=state.mode==="person";
  const is=curIssue(); $("ititle").textContent=is.title; $("iref").textContent=is.ref; $("ifoot").textContent=is.foot||"";
  $("issues").innerHTML=`<span class="ilab">עלון:</span>`+ISSUES.slice().reverse().map(i=>`<button class="ibtn" data-i="${i.id}" aria-pressed="${i.id===state.issue}">${esc(i.parsha)} <span class="ititle">· ${esc(i.title)}</span></button>`).join("");
  renderStatus(); renderEssay(); if(state.mode==="person")renderChips(); renderPanel();
}
/* re-render from live data without clobbering a half-typed comment */
let pending=false;
function liveRender(){ const a=document.activeElement; if(a&&a.closest&&(a.closest("#add-form")||a.closest("#pen-form"))){pending=true;return;} pending=false; render(); }
document.addEventListener("focusout",e=>{ if(pending&&e.target.closest&&e.target.closest("#add-form")) setTimeout(()=>{ if(!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#add-form"))) liveRender(); },0); });

/* ---------- pen names ---------- */
function penProblem(n){
  if(n.length<2) return "השם צריך להכיל לפחות שני תווים.";
  if(STATIC.includes(n)) return "השם הזה שמור.";
  const taken=Object.entries(pens).some(([u,v])=>u!==me.id&&String(v).trim()===n);
  if(taken) return "מפרש אחר כבר בחר בשם הזה.";
  return "";
}
async function savePen(n){
  await serial("p:"+me.id, async()=>{ await db.doc("penNames/"+me.id).set({name:n}); pens[me.id]=n; });
}
/* ---------- writes (one at a time per document) ---------- */
const chains={};
function serial(key,fn){ const p=(chains[key]||Promise.resolve()).then(fn,fn); chains[key]=p.catch(()=>{}); return p; }
function handleWriteError(err,msgEl){
  const code=err&&err.code;
  if(code==="invalid_argument"||code==="not_granted"||code==="revoked"){ writable=false; readOnlyReason="denied"; render(); return; }
  if(msgEl) msgEl.textContent = code==="quota_exceeded"?"המאגר מלא. כדאי למחוק פירושים ישנים.":"השמירה לא הצליחה. נסו שוב בעוד רגע.";
}
function newId(){ return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
async function addComment(){
  const form=$("add-form"); if(!form) return;
  const msg=$("add-msg"), btn=$("add-btn");
  const text=$("add-text").value.trim(), dh=$("add-dh").value.trim(), seg=$("add-seg").value;
  const rawLink=$("add-link").value.trim(), link=rawLink?safeUrl(rawLink):"";
  const fileIn=$("add-file"), file=fileIn&&fileIn.files&&fileIn.files[0];
  if(rawLink&&!link){ msg.textContent="הקישור צריך להתחיל ב-https://"; $("add-link").focus(); return; }
  if(!text&&!link&&!file){ msg.textContent="כתבו פירוש, או צרפו קישור או קובץ."; $("add-text").focus(); return; }
  const penIn=$("add-pen");
  if(penIn){ const n=penIn.value.trim(); const pr=penProblem(n); if(pr){ msg.textContent=pr; penIn.focus(); return; }
    try{ await savePen(n); }catch(err){ handleWriteError(err,msg); return; } }
  if(file&&file.size>20*1024*1024){ msg.textContent="הקובץ גדול מ-20MB."; return; }
  if(file&&!/^(image\/(png|jpeg|gif|webp)|application\/pdf)$/.test(file.type)){ msg.textContent="אפשר לצרף תמונה (PNG, JPG, GIF, WEBP) או PDF."; return; }
  const pi=state.para; const sid=seg||ESSAY[pi].segs[0][0];
  btn.disabled=true; msg.textContent=file?"מעלה את הקובץ…":"שומר…";
  let att=null;
  if(file){
    try{ const r=await assets.upload(file); att={id:r.id,type:r.contentType,name:file.name.slice(0,120)}; }
    catch(err){ btn.disabled=false; const c=err&&err.code; msg.textContent= c==="too_large"?"הקובץ גדול מדי.":c==="unsupported_type"?"סוג הקובץ לא נתמך.":c==="quota_or_state"?"נגמר המקום לקבצים בדף.":"העלאת הקובץ נכשלה. נסו שוב."; return; }
    msg.textContent="שומר…";
  }
  try{
    await serial("c:"+me.id, async()=>{
      const mine=Object.assign({}, commDocs[me.id]||{});
      const cid=newId();
      mine[cid]={issue:state.issue,p:pi,s:[sid],whole:!seg,dh,text,link,att,at:new Date().toISOString()};
      await db.doc("comments/"+me.id).set({items:mine});
      commDocs[me.id]=mine; openIds.add("c:"+me.id+":"+cid);
    });
    state.draft={seg:"",dh:"",text:"",link:"",pen:""}; document.activeElement&&document.activeElement.blur&&document.activeElement.blur(); pending=false; render();
    const m=$("add-msg"); if(m) m.textContent="הפירוש פורסם.";
  }catch(err){ btn.disabled=false; handleWriteError(err,msg); }
}
async function deleteComment(id){
  const [,uid,cid]=id.split(":");
  try{
    await serial("c:"+uid, async()=>{
      const items=Object.assign({}, commDocs[uid]||{}); const old=items[cid]; delete items[cid];
      if(old&&old.att&&old.att.id&&assets){ try{ await assets.delete(old.att.id); }catch(e){} }
      await db.doc("comments/"+uid).set({items}); commDocs[uid]=items;
    });
    openIds.delete(id); render();
  }catch(err){ handleWriteError(err,null); }
}
async function toggleLike(id,btn){
  if(!writable) return;
  try{
    await serial("l:"+me.id, async()=>{
      const mine=Object.assign({}, likeDocs[me.id]||{});
      if(mine[id]) delete mine[id]; else mine[id]=true;
      await db.doc("likes/"+me.id).set({items:mine}); likeDocs[me.id]=mine;
    });
    const c=ALL().find(x=>x.id===id); if(btn&&c){ btn.setAttribute("aria-pressed",iLiked(id)); btn.textContent="👍 "+likes(c); }
  }catch(err){ handleWriteError(err,null); }
}

/* ---------- events ---------- */
function openPara(pi){ state.mode="para"; state.para=(state.para===pi)?null:pi; openIds.clear(); render(); }
document.addEventListener("toggle",e=>{const d=e.target; if(d.matches&&d.matches("details.it")){ d.open?openIds.add(d.dataset.id):openIds.delete(d.dataset.id);} },true);
document.addEventListener("input",e=>{ const id=e.target.id; if(id==="add-text")state.draft.text=e.target.value; if(id==="add-dh")state.draft.dh=e.target.value; if(id==="add-seg")state.draft.seg=e.target.value; if(id==="add-link")state.draft.link=e.target.value; if(id==="add-pen")state.draft.pen=e.target.value; });
document.addEventListener("change",e=>{ if(e.target.id==="add-seg") state.draft.seg=e.target.value; });
document.addEventListener("submit",async e=>{
  if(e.target.id==="add-form"){ e.preventDefault(); addComment(); }
  if(e.target.id==="pen-form"){ e.preventDefault(); const n=$("pen-in").value.trim(), m=$("pen-msg"); const pr=penProblem(n); if(pr){m.textContent=pr;return;}
    m.textContent="שומר…"; try{ await savePen(n); editingPen=false; render(); }catch(err){ handleWriteError(err,m); } }
});
document.addEventListener("click",e=>{
  const l=e.target.closest(".like"); if(l){e.preventDefault();toggleLike(l.dataset.id,l);return;}
  const dl=e.target.closest(".del"); if(dl){e.preventDefault(); if(dl.dataset.armed){deleteComment(dl.dataset.id);} else {dl.dataset.armed="1"; dl.textContent="למחוק? לחצו שוב";} return;}
  const cx=e.target.closest(".ctx"); if(cx){const pi=SEGPARA[cx.dataset.s];setIssue(SEGISSUE[cx.dataset.s],false);state.mode="para";state.para=pi;openIds.clear();render();document.querySelector(`section[data-p="${pi}"]`)?.scrollIntoView({block:"start"});return;}
  if(e.target.closest(".close")){state.para=null;render();return;}
  if(e.target.id==="pen-edit"){ editingPen=true; renderStatus(); $("pen-in")&&$("pen-in").focus(); return; }
  if(e.target.id==="pen-cancel"){ editingPen=false; renderStatus(); return; }
  if(e.target.closest("#add-form")||e.target.closest("#pen-form")) return;
  const pa=e.target.closest(".para"); if(pa){openPara(+pa.dataset.p);return;}
  const ib=e.target.closest(".ibtn"); if(ib){ setIssue(ib.dataset.i,true); render(); window.scrollTo({top:0}); return; }
  const ch=e.target.closest(".chip"); if(ch){state.person=ch.dataset.p;openIds.clear();render();return;}
  if(e.target.id==="m-seg"){state.mode="para";state.para=null;render();}
  if(e.target.id==="m-person"){state.mode="person";openIds.clear();render();window.scrollTo({top:0});}
});
document.addEventListener("keydown",e=>{const pa=e.target.closest&&e.target.closest(".para"); if(pa&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openPara(+pa.dataset.p);}});

/* ---------- issues ---------- */
function setIssue(id,resetPara){ if(!ISSUE_BY_ID[id]) return; state.issue=id; ESSAY=ISSUE_BY_ID[id].essay; if(resetPara){state.para=null; openIds.clear();} state.draft={seg:"",dh:"",text:"",link:"",pen:state.draft.pen||""}; try{ history.replaceState(null,"","#"+id); }catch(e){} }
try{ const h=(location.hash||"").slice(1); if(ISSUE_BY_ID[h]) setIssue(h,true); }catch(e){}
/* ---------- guided tour ---------- */
const TOUR=[
 {t:"ברוכים הבאים לתורה שבענן",b:"זה דף גמרא דיגיטלי סביב העלון ״פרשת השבוע למהנדסים״. העלון במרכז, וסביבו שלושה רבדים: באר הפוטנציאל (המדע), המקורות, ומפרשי הקהילה, כלומר אתם. ההדרכה לוקחת דקה."},
 {sel:"#issues",t:"בחירת עלון",b:"כאן עוברים בין העלונים. הדף נפתח תמיד על העלון האחרון, וכל עלון שומר את הפירושים שלו."},
 {sel:".modes",t:"שתי דרכים לקרוא",b:"״לפי פסקה״: העלון עצמו, וכל פסקה נפתחת עם מה שנכתב עליה. ״לפי מפרש״: כל מה שמפרש אחד כתב, ברצף, מכל העלונים, עם ניקוד ה-👍 שלו."},
 {sel:"#status",t:"השם שלכם כמפרשים",b:"כאן מופיע השם שבו אתם כותבים. בוחרים אותו לפני הפירוש הראשון, ואפשר לשנות אותו בכל רגע. השינוי חל גם על כל מה שכבר כתבתם. אם כתוב ״מצב קריאה בלבד״, צריך הזמנה מאביב.",when:()=>!$("status").hidden},
 {sel:'.para[data-p="0"]',t:"לחצו על פסקה",b:"האותיות והמספרים הקטנים הם סימני ההערות, כמו בעלון המודפס: אות היא מקור, ומספר הוא הערה של באר הפוטנציאל. מתחת לכל פסקה כתוב כמה פירושים יש עליה.",pre:()=>{ if(state.mode!=="para"){state.mode="para";} state.para=null; render(); }},
 {sel:"#panel",t:"כל מה שנכתב על הפסקה",b:"הפירושים מסודרים בשלוש קבוצות. לחיצה על שורה פותחת אותה במלואה: ההסבר המדעי, הטקסט המלא של המקור עם קישור לספריא, או פירוש של משתתף. לחיצה נוספת על הפסקה סוגרת.",pre:()=>{ state.mode="para"; const bn=C.find(c=>c.kind==="beer"&&c.s.some(x=>SEGISSUE[x]===state.issue)); const pi=bn?SEGPARA[bn.s.find(x=>SEGISSUE[x]===state.issue)]:0; state.para=pi; openIds.clear(); if(bn) openIds.add(bn.id); render(); }},
 {sel:"#panel .add",t:"הוסיפו פירוש משלכם",b:"בוחרים אם הפירוש על כל הפסקה או על משפט מסוים, מוסיפים כותרת קצרה, כותבים, ואפשר לצרף קישור, תמונה או PDF. הפירוש מופיע מיד אצל כולם.",pre:()=>{ if(state.para==null){state.mode="para";state.para=0;render();} }},
 {sel:"#panel details[open] .like",t:"👍 על פירוש טוב",b:"כל אחד יכול לסמן 👍 פעם אחת על כל פירוש. הפירושים האהובים עולים לראש הרשימה, ובהמשך ייכנסו לעלון המודפס ולספר.",when:()=>!!document.querySelector("#panel details[open] .like")},
 {sel:"#theme-btn",t:"מצב יום ולילה",b:"כפתור זה מחליף בין רקע בהיר לכהה."},
 {sel:"#tour-btn",t:"זהו, אפשר להתחיל",b:"אפשר לחזור להדרכה בכל רגע מהכפתור הזה. לימוד נעים!",last:true},
];
let tourI=-1, tourSteps=[];
function tourOpen(){ tourSteps=TOUR; tourI=-1; $("tour").hidden=false; document.body.classList.add("touring"); tourGo(1); }
function tourClose(){ $("tour").hidden=true; document.body.classList.remove("touring"); tourI=-1; try{localStorage.setItem("tb-tour","done");}catch(e){} }
function tourGo(dir){
  let i=tourI+dir;
  while(i>=0&&i<tourSteps.length){ const s=tourSteps[i]; if(s.pre) s.pre(); if((!s.when||s.when())&&(!s.sel||document.querySelector(s.sel))) break; i+=dir; }
  if(i<0||i>=tourSteps.length){ tourClose(); return; }
  tourI=i; const s=tourSteps[i];
  $("tour-n").textContent=`${i+1} מתוך ${tourSteps.length}`; $("tour-t").textContent=s.t; $("tour-b").textContent=s.b;
  $("tour-prev").hidden=i===0; $("tour-next").textContent=(i===tourSteps.length-1)?"סיום":"הבא";
  const el=s.sel?document.querySelector(s.sel):null;
  if(el){ el.scrollIntoView({block:"center",behavior:"auto"}); }
  requestAnimationFrame(()=>tourPlace(el));
  $("tour-next").focus();
}
function tourPlace(el){
  const spot=$("tour-spot"), card=$("tour-card");
  card.style.top=""; card.style.bottom="";
  if(!el){ spot.style.cssText="display:none"; card.classList.add("center"); return; }
  card.classList.remove("center");
  const r=el.getBoundingClientRect(), pad=6, vh=window.innerHeight;
  const top=Math.max(4,r.top-pad), h=Math.min(r.height+pad*2, vh-8-top);
  spot.style.cssText=`display:block;top:${top}px;left:${Math.max(4,r.left-pad)}px;width:${Math.min(r.width+pad*2,window.innerWidth-8)}px;height:${Math.max(24,h)}px`;
  const below=vh-(top+h), above=top;
  if(below>=above){ card.style.top=Math.min(top+h+10, vh-card.offsetHeight-8)+"px"; } else { card.style.top=Math.max(8, top-card.offsetHeight-10)+"px"; }
}
$("tour-btn").addEventListener("click",tourOpen);
$("tour-next").addEventListener("click",()=>tourGo(1));
$("tour-prev").addEventListener("click",()=>tourGo(-1));
$("tour-skip").addEventListener("click",tourClose);
document.addEventListener("keydown",e=>{ if($("tour").hidden) return; if(e.key==="Escape") tourClose(); if(e.key==="ArrowLeft") tourGo(1); if(e.key==="ArrowRight") tourGo(-1); });
window.addEventListener("resize",()=>{ if(!$("tour").hidden&&tourI>=0){ const s=tourSteps[tourI]; tourPlace(s.sel?document.querySelector(s.sel):null);} });
/* ---------- accessibility ---------- */
const FS=[1,1.15,1.3,1.5,1.75];
let A11Y={fs:0,spacing:false,contrast:false,font:false,links:false,motion:false};
try{ const s=JSON.parse(localStorage.getItem("tb-a11y")||"null"); if(s&&typeof s==="object") A11Y=Object.assign(A11Y,s); }catch(e){}
function applyA11y(){
  A11Y.fs=Math.max(0,Math.min(FS.length-1,A11Y.fs|0));
  const w=document.querySelector(".wrap"); w.style.zoom=FS[A11Y.fs]===1?"":String(FS[A11Y.fs]);
  const r=document.documentElement.classList;
  r.toggle("a-spacing",!!A11Y.spacing); r.toggle("a-contrast",!!A11Y.contrast); r.toggle("a-font",!!A11Y.font); r.toggle("a-links",!!A11Y.links); r.toggle("a-motion",!!A11Y.motion);
  $("fs-val").textContent=Math.round(FS[A11Y.fs]*100)+"%"; $("fs-dn").disabled=A11Y.fs===0; $("fs-up").disabled=A11Y.fs===FS.length-1;
  ["spacing","contrast","font","links","motion"].forEach(k=>$("a-"+k).checked=!!A11Y[k]);
  const on=A11Y.fs>0||A11Y.spacing||A11Y.contrast||A11Y.font||A11Y.links||A11Y.motion; $("a11y-btn").classList.toggle("on",on);
  try{ localStorage.setItem("tb-a11y",JSON.stringify(A11Y)); }catch(e){}
}
function a11yToggle(show){ const p=$("a11y"); const open=show==null?p.hidden:show; p.hidden=!open; $("a11y-btn").setAttribute("aria-expanded",open); if(open) $("fs-up").focus(); }
$("a11y-btn").addEventListener("click",()=>a11yToggle());
$("a11y-close").addEventListener("click",()=>{a11yToggle(false);$("a11y-btn").focus();});
$("fs-up").addEventListener("click",()=>{A11Y.fs++;applyA11y();});
$("fs-dn").addEventListener("click",()=>{A11Y.fs--;applyA11y();});
["spacing","contrast","font","links","motion"].forEach(k=>$("a-"+k).addEventListener("change",e=>{A11Y[k]=e.target.checked;applyA11y();}));
$("a11y-reset").addEventListener("click",()=>{A11Y={fs:0,spacing:false,contrast:false,font:false,links:false,motion:false};applyA11y();});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("a11y").hidden){a11yToggle(false);$("a11y-btn").focus();} });
document.addEventListener("click",e=>{ if(!$("a11y").hidden&&!e.target.closest("#a11y")&&!e.target.closest("#a11y-btn")) a11yToggle(false); });
applyA11y();
/* ---------- day / night ---------- */
function sysDark(){ return matchMedia("(prefers-color-scheme: dark)").matches; }
function curTheme(){ const a=document.documentElement.getAttribute("data-theme"); return a||(sysDark()?"dark":"light"); }
function paintThemeBtn(){ const dark=curTheme()==="dark"; const b=$("theme-btn"); b.textContent=dark?"☀️":"🌙"; b.setAttribute("aria-label",dark?"מעבר למצב יום":"מעבר למצב לילה"); }
try{ const saved=localStorage.getItem("tb-theme"); if(saved==="dark"||saved==="light") document.documentElement.setAttribute("data-theme",saved); }catch(e){}
paintThemeBtn();
$("theme-btn").addEventListener("click",()=>{ const next=curTheme()==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme",next); try{localStorage.setItem("tb-theme",next);}catch(e){} paintThemeBtn(); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintThemeBtn); }catch(e){}

render();
try{ if(localStorage.getItem("tb-tour")!=="done") setTimeout(()=>{ if($("tour").hidden) tourOpen(); },900); }catch(e){}

/* ---------- connect to shared data ---------- */
async function refreshNames(){
  if(!user) return;
  const ids=[...new Set([...Object.keys(commDocs)])];
  if(!ids.length) return;
  try{ const ps=await user.profiles(ids); let changed=false; for(const id of ids){ const n=(ps[id]&&ps[id].name)||""; if(names[id]!==n){names[id]=n;changed=true;} } if(changed) liveRender(); }catch(e){}
}
(async()=>{
  try{
    user=window.claude?await window.claude.use("user"):null;
    db=window.claude?await window.claude.use("db"):null;
    assets=window.claude?await window.claude.use("assets"):null;
  }catch(e){ db=null; }
  if(user){ try{ const m=await user.me(); me={id:m.id,isOwner:!!m.isOwner}; }catch(e){} }
  if(!db){ readOnlyReason="nodb"; render(); return; }
  if(!me.id){ readOnlyReason="noid"; } else { writable=true; readOnlyReason=""; }
  render();
  db.collection("comments").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.items&&typeof v.items==="object") next[d.id]=v.items; });
    commDocs=next; liveRender(); refreshNames();
  },err=>{ if(err&&err.code==="revoked"){ writable=false; readOnlyReason="denied"; render(); } });
  db.collection("penNames").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&typeof v.name==="string"&&v.name.trim()) next[d.id]=v.name.trim().slice(0,30); });
    pens=next; liveRender();
  },()=>{});
  db.collection("likes").onSnapshot(snap=>{
    const next={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.items&&typeof v.items==="object") next[d.id]=v.items; });
    likeDocs=next; liveRender();
  },()=>{});
})();
</script>
